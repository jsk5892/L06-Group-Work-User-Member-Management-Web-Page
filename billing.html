<!DOCTYPE html>
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <nav class="navbar navbar-expand bg-light">
  <div class="container">
    <a class="navbar-brand" href="index.html">Happy Valley Events</a>
    <div>
      <a class="btn btn-outline-primary" href="index.html">Home</a>
      <a class="btn btn-outline-primary" href="store.html">Store</a>
      <a class="btn btn-outline-primary" href="cart.html">Cart</a>
      <a class="btn btn-outline-primary" href="billing.html">Billing</a>
      <a class="btn btn-outline-primary" href="signup.html">Sign Up</a>
      <a class="btn btn-outline-primary" href="shipping.html">Register</a>
      <a class="btn btn-outline-primary" href="returns.html">Returns</a>
    </div>
  </div>
    </nav>
    
    <div class="container">
  <div id="registration-root"></div>
</div>

<section class="container pb-5">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="h4 mb-3">Billing Information</h2>

            <form id="billingForm">
                <div class="mb-3">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullName">
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Billing Address</label>
                    <input type="text" class="form-control" id="address">
                </div>

                <div class="mb-3">
                    <label for="cardNumber" class="form-label">Card Number</label>
                    <input type="text" class="form-control" id="cardNumber" placeholder="16 digits">
                </div>

                <div class="mb-3">
                    <label for="expiration" class="form-label">Expiration</label>
                    <input type="text" class="form-control" id="expiration" placeholder="MM/YY">
                </div>

                <div class="mb-3">
                    <label for="securityCode" class="form-label">Security Code</label>
                    <input type="text" class="form-control" id="securityCode" placeholder="6 digits">
                </div>

                <button type="submit" class="btn btn-primary">Validate Billing</button>
            </form>
        </div>
    </div>
</section>

<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script src="checkout.js"></script>
</body>
