<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Next Level Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <section class="hero d-flex align-items-center text-center text-black">
    <div class="container">
      <h1 class="display-4 fw-bold">Next Level Events <span class="gradient-text"></span> Register with us right here</h1>
      <p class="lead mt-2 mb-0">Scheduling made easy.</p>
    </div>
  </section>

  <section id="greeting" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <article class="card shadow-sm overflow-hidden">
          <img
            src="https://plus.unsplash.com/premium_photo-1679547202671-f9dbbf466db4?q=80&w=1932&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            class="card-img-top"
            alt="Graduation">
          <div class="card-body p-4">
            <h2 class="h3 text-primary mb-3"></h2>
            <p class="mb-3">
              Whether it's your first ever event with our group or your twentieth, we hope to make the sign up process as simple as possible.
            </p>
            <p class="fw-semibold mb-0">— Next Level Events Team</p>
          </div>
        </article>
      </div>
    </div>
  </section>
</body>
</html>
