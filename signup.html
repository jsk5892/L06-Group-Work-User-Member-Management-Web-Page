<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>SignUp Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand bg-light">
  <div class="container">
    <a class="navbar-brand" href="index.html">Happy Valley Events</a>
    <div>
      <a class="btn btn-outline-primary" href="index.html">Home</a>
      <a class="btn btn-outline-primary" href="store.html">Store</a>
      <a class="btn btn-outline-primary" href="signup.html">Sign Up</a>
    </div>
  </div>
</nav>
    <header class="text-center">
        <h1 class="display-1 mb-5">Sign Up for an Event</h1>
    </header>

    <form id="signupform">
        <div class="mb-2">
            <label class="form-label">Full Name:</label>
            <input type="text" class="form-control" id="name" required>
        </div>

        <div class="mb-2">
            <label class="form-label">Age:</label>
            <input type="number" class="form-control" id="age" required>
            </div>

        <div class="mb-2">
            <label class="form-label">Address:</label>
            <input type="text" class="form-control" id="address" required>
        </div>

        <div class="mb-2">
            <label class="form-label">Email:</label>
            <input type="text" class="form-control" id="email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number:</label>
            <input type="text" class="form-control" id="phone">
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary"> Sign Up</button>
        </div>


    </form>

    <h1 class="mt-5">Attendees: </h2>
    <div class="table-responsive">
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Address</th>
                    <th>Email</th>
                    <th>Phone Number</th>
                </tr>
            </thead>

            <tbody id="attendees">
                
            </tbody>
        </table>
    </div>

    <script src="site.js"></script>


    <div class="d-flex justify-content-center mt-5">
        <a class="btn btn-primary" href="index.html">Back to Home</a>
    </div>
</body>
